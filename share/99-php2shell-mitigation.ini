; php2shell-hotfix:CVE-2026-109618:CVE-2026-109619
; Temporary, partial mitigation for the 21 October 2026 PHP security release.
; NOT a complete fix. Upgrade to 8.2.35, 8.3.36, 8.4.27, or 8.5.12.
; Install into the SAPI conf.d (cli, fpm, and apache2 are separate on Debian).
; ini_set() and .user.ini are applied too late to help.
; Do not use RLIMIT_AS or RLIMIT_DATA.
session.upload_progress.enabled = 0
memory_limit = -1

; Uncomment on PHP 8.5 only. Older branches warn on this unknown directive.
; fatal_error_backtraces = 0
