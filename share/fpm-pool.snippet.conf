; Pool-level equivalent of the drop-in. php_admin_value cannot be overridden
; by the application. Partial mitigation only — upgrade PHP.
; Do not set rlimit_core / RLIMIT_AS / RLIMIT_DATA to "fix" this.
php_admin_value[session.upload_progress.enabled] = 0
php_admin_value[memory_limit] = -1
; PHP 8.5 only:
; php_admin_flag[fatal_error_backtraces] = off
; Optional and expensive. pm.max_requests = 1 recycles the worker every request.
; It is not a fix. Leave it unset unless you have no other choice.
