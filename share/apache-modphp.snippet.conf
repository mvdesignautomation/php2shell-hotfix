# mod_php is the highest-risk SAPI: a request can reach the bug before
# application code runs. Partial mitigation only — upgrade PHP.
# Do not use RLimitMEM (RLIMIT_AS / RLIMIT_DATA). It takes the vulnerable path.
php_admin_value session.upload_progress.enabled 0
php_admin_value memory_limit -1
# PHP 8.5 only:
# php_admin_flag fatal_error_backtraces Off
